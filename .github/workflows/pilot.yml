name: Posit pilot checks
on:
  push:
    paths: ['pilot/**', '.github/workflows/pilot.yml']
  pull_request:
    paths: ['pilot/**', '.github/workflows/pilot.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright openpyxl
      - run: python -m playwright install --with-deps chromium
      - run: Rscript -e 'renv::load();source("tests/run.R")'
        working-directory: pilot
      - run: OLSD_USE_RENV=true python tests/run_browser.py
        working-directory: pilot
      - run: OLSD_USE_RENV=true OLSD_BROWSER_SCALE=true python tests/run_browser.py
        working-directory: pilot
