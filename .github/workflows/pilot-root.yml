name: Update root-layout pilot branch
on:
  push:
    branches: ['production/posit-connect-pilot']
    paths: ['pilot/**', 'tools/sync_pilot_root.py', '.github/workflows/pilot-root.yml']
permissions:
  contents: write
concurrency:
  group: pilot-root-delivery
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name 'OLSD source maintenance'
          git config user.email 'olsd-source@users.noreply.github.com'
          python tools/sync_pilot_root.py --push
